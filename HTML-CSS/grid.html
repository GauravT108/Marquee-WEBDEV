<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        /* border: 4px solid purple; */
        border-radius: 5px;
        height: 100%;
        /* background-color: rgb(237, 60, 116); */
      }

      h2 {
        display: flex;
        justify-content: center;
      }

      .grid-container {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 450px 450px 450px;
        grid-template-rows: 100%;
        column-gap: 5px;
        row-gap: 20px;
      }

      .grid-container p {
        color: white;
        font-size: large;
        border-radius: 5px;
        height: 100px;
        background-color: rgb(14, 34, 44);
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Pricing Card</h2>
    </header>
    <div class="grid-container">
      <p>1</p>
      <p>2</p>
      <p>3</p>
    </div>
  </body>
</html>
