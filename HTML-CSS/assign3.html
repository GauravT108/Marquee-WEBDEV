<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assign3.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="card-header">
        <button class="add-btn">+</button>
        <img
          class="profile-img"
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400"
          alt="gopi bahu"
        />
      </div>

      <div class="card-body">
        <h2 class="user-name">Gopi Bahu</h2>
        <p class="user-title">
          Product Designer who focuses on simplicity & usability.
        </p>
      </div>

      <div class="card-stats">
        <div class="stat-box">
          <span class="stat-number">69K</span>
          <span class="stat-label">Likes</span>
        </div>
        <div class="stat-box">
          <span class="stat-number">666</span>
          <span class="stat-label">Posts</span>
        </div>
        <div class="stat-box">
          <span class="stat-number">472.9K</span>
          <span class="stat-label">Views</span>
        </div>
      </div>

      <div class="card-footer">
        <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
      </div>
    </div>
  </body>
</html>
