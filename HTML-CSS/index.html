<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Product Card</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="product-card">
      <div class="product-tumb">
        <img
          src="https://neemans.com/cdn/shop/files/ND_-_CCSN_-_Grey_Web_Catalog_f.jpg?v=1761299731&width=1600"
          alt="Nike Air Jordan"
        />
      </div>
      <div class="product-details">
        <span class="product-catagory">Running Shoes</span>
        <h4><a href="#">Nike Air Max 270</a></h4>
        <p>
          Experience ultimate comfort and responsive cushioning with every
          single stride.
        </p>
        <div class="product-bottom-details">
          <div class="product-price">
            <small><s>15000</s></small
            >12000
          </div>
          <div class="product-links">
            <button class="buy-btn">Buy Now</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
